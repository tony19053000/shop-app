      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#EBE3D7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1F1D1A" flood-opacity="0.08" />
    </filter>
